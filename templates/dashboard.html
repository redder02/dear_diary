<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="topbar">
        <h2>My Diary</h2>
        <div>
            <a href="/new">+ New</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    {% for e in entries %}
    <div class="entry">
        <div class="date">{{ e["created_at"] }}</div>
        <div class="content">{{ e["content"] }}</div>
    </div>
    {% endfor %}
</div>
</body>
</html>
